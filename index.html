<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorgu Paneli - CORS Çözümlü</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --sidebar-bg: #2c3e50;
            --sidebar-text: #ecf0f1;
            --active-tab: #3498db;
            --card-bg: #ffffff;
            --text-color: #333;
            --border-color: #ddd;
            --btn-primary: #3498db;
            --btn-hover: #2980b9;
            --error-color: #e74c3c;
            --success-color: #2ecc71;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 250px;
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text);
            display: flex;
            flex-direction: column;
            padding-top: 20px;
            flex-shrink: 0;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--sidebar-text);
            padding: 15px 20px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            border-left: 4px solid transparent;
        }

        .tab-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .tab-btn.active {
            background-color: rgba(52, 152, 219, 0.2);
            border-left-color: var(--active-tab);
            font-weight: bold;
        }

        /* Main Content Styles */
        .main-content {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .query-card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            display: none; /* Hidden by default */
        }

        .query-card.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .query-card h3 {
            margin-bottom: 20px;
            color: var(--text-color);
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: var(--active-tab);
        }

        .btn-query {
            width: 100%;
            padding: 12px;
            background-color: var(--btn-primary);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: bold;
        }

        .btn-query:hover {
            background-color: var(--btn-hover);
        }

        .btn-query:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* Result Area */
        .result-area {
            margin-top: 20px;
            padding: 15px;
            background-color: var(--bg-color);
            border-radius: 5px;
            min-height: 100px;
            border: 1px solid var(--border-color);
            word-break: break-word;
        }

        .result-area.loading {
            color: #777;
            font-style: italic;
        }

        .result-area.error {
            color: var(--error-color);
            border-color: var(--error-color);
        }

        .result-area.success {
            color: var(--text-color);
            border-color: var(--success-color);
        }

        pre {
            text-align: left;
            white-space: pre-wrap;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                overflow: auto;
            }
            .sidebar {
                width: 100%;
                flex-direction: row;
                overflow-x: auto;
                padding-top: 0;
            }
            .sidebar h2 {
                display: none;
            }
            .tab-btn {
                padding: 15px;
                white-space: nowrap;
                border-left: none;
                border-bottom: 4px solid transparent;
            }
            .tab-btn.active {
                border-left: none;
                border-bottom-color: var(--active-tab);
            }
            .main-content {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>SORGU PANELİ</h2>
        <button class="tab-btn active" onclick="openTab('tcpro')">TC Pro Sorgula</button>
        <button class="tab-btn" onclick="openTab('adsoyad')">Ad Soyad Sorgula</button>
        <button class="tab-btn" onclick="openTab('ailepro')">Aile Pro Sorgula</button>
        <button class="tab-btn" onclick="openTab('sulale')">Sülale Sorgula</button>
        <button class="tab-btn" onclick="openTab('tcgsm')">TC GSM Sorgula</button>
        <button class="tab-btn" onclick="openTab('gsmtc')">GSM TC Sorgula</button>
        <button class="tab-btn" onclick="openTab('eokul')">EO Okul Sorgula</button>
        <button class="tab-btn" onclick="openTab('adres')">Adres Sorgula</button>
        <button class="tab-btn" onclick="openTab('adaparsel')">Ada Parsel Sorgula</button>
    </div>

    <!-- Main Content -->
    <div class="main-content">

        <!-- TC Pro -->
        <div id="tcpro" class="query-card active">
            <h3>TC Kimlik Numarası Sorgula</h3>
            <div class="input-group">
                <label for="tc_input_tcpro">TC Kimlik No (11 Hane)</label>
                <input type="text" id="tc_input_tcpro" placeholder="11 haneli TC giriniz" maxlength="11" pattern="\d*">
            </div>
            <button class="btn-query" onclick="fetchData('tcpro', 'tc', 'tc_input_tcpro')">Sorgula</button>
            <div class="result-area" id="result_tcpro"></div>
        </div>

        <!-- Ad Soyad -->
        <div id="adsoyad" class="query-card">
            <h3>Ad Soyad Sorgula</h3>
            <div class="input-group">
                <label for="name_input_adsoyad">Ad</label>
                <input type="text" id="name_input_adsoyad" placeholder="Adınızı giriniz">
            </div>
            <div class="input-group">
                <label for="surname_input_adsoyad">Soyad</label>
                <input type="text" id="surname_input_adsoyad" placeholder="Soyadınızı giriniz">
            </div>
            <button class="btn-query" onclick="fetchData('adsoyad', null, null, true)">Sorgula</button>
            <div class="result-area" id="result_adsoyad"></div>
        </div>

        <!-- Aile Pro -->
        <div id="ailepro" class="query-card">
            <h3>Aile Pro Sorgula</h3>
            <div class="input-group">
                <label for="tc_input_ailepro">TC Kimlik No (11 Hane)</label>
                <input type="text" id="tc_input_ailepro" placeholder="11 haneli TC giriniz" maxlength="11" pattern="\d*">
            </div>
            <button class="btn-query" onclick="fetchData('ailepro', 'tc', 'tc_input_ailepro')">Sorgula</button>
            <div class="result-area" id="result_ailepro"></div>
        </div>

        <!-- Sülale -->
        <div id="sulale" class="query-card">
            <h3>Sülale Sorgula</h3>
            <div class="input-group">
                <label for="tc_input_sulale">TC Kimlik No (11 Hane)</label>
                <input type="text" id="tc_input_sulale" placeholder="11 haneli TC giriniz" maxlength="11" pattern="\d*">
            </div>
            <button class="btn-query" onclick="fetchData('sulale', 'tc', 'tc_input_sulale')">Sorgula</button>
            <div class="result-area" id="result_sulale"></div>
        </div>

        <!-- TC GSM -->
        <div id="tcgsm" class="query-card">
            <h3>TC'den GSM Çek</h3>
            <div class="input-group">
                <label for="tc_input_tcgsm">TC Kimlik No (11 Hane)</label>
                <input type="text" id="tc_input_tcgsm" placeholder="11 haneli TC giriniz" maxlength="11" pattern="\d*">
            </div>
            <button class="btn-query" onclick="fetchData('tcgsm', 'tc', 'tc_input_tcgsm')">Sorgula</button>
            <div class="result-area" id="result_tcgsm"></div>
        </div>

        <!-- GSM TC -->
        <div id="gsmtc" class="query-card">
            <h3>GSM'den TC Çek</h3>
            <div class="input-group">
                <label for="gsm_input_gsmtc">GSM Numarası</label>
                <input type="text" id="gsm_input_gsmtc" placeholder="05XX XXX XX XX" maxlength="11">
            </div>
            <button class="btn-query" onclick="fetchData('gsmtc', 'gsm', 'gsm_input_gsmtc')">Sorgula</button>
            <div class="result-area" id="result_gsmtc"></div>
        </div>

        <!-- EO Okul -->
        <div id="eokul" class="query-card">
            <h3>EO Okul Sorgula</h3>
            <div class="input-group">
                <label for="tc_input_eokul">TC Kimlik No (11 Hane)</label>
                <input type="text" id="tc_input_eokul" placeholder="11 haneli TC giriniz" maxlength="11" pattern="\d*">
            </div>
            <button class="btn-query" onclick="fetchData('eokul', 'tc', 'tc_input_eokul')">Sorgula</button>
            <div class="result-area" id="result_eokul"></div>
        </div>

        <!-- Adres -->
        <div id="adres" class="query-card">
            <h3>Adres Sorgula</h3>
            <div class="input-group">
                <label for="tc_input_adres">TC Kimlik No (11 Hane)</label>
                <input type="text" id="tc_input_adres" placeholder="11 haneli TC giriniz" maxlength="11" pattern="\d*">
            </div>
            <button class="btn-query" onclick="fetchData('adres', 'tc', 'tc_input_adres')">Sorgula</button>
            <div class="result-area" id="result_adres"></div>
        </div>

        <!-- Ada Parsel -->
        <div id="adaparsel" class="query-card">
            <h3>Ada Parsel Sorgula</h3>
            <div class="input-group">
                <label for="address_input_adaparsel">Adres / Lokasyon Bilgisi</label>
                <input type="text" id="address_input_adaparsel" placeholder="Örn: Kadıköy, İstanbul veya Mahalle adı">
            </div>
            <button class="btn-query" onclick="fetchData('adaparsel', 'address', 'address_input_adaparsel')">Sorgula</button>
            <div class="result-area" id="result_adaparsel"></div>
        </div>

    </div>

    <script>
        // Tab Switching Logic
        function openTab(tabName) {
            // Hide all cards
            const cards = document.querySelectorAll('.query-card');
            cards.forEach(card => card.classList.remove('active'));

            // Deactivate all buttons
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            // Show selected card and activate button
            document.getElementById(tabName).classList.add('active');
            
            // Find the button that called this function and add active class
            const clickedBtn = Array.from(buttons).find(btn => btn.getAttribute('onclick').includes(tabName));
            if(clickedBtn) clickedBtn.classList.add('active');
        }

        // Fetch Data Logic with CORS Proxy
        async function fetchData(apiName, paramType, inputId, isMultiParam = false) {
            const resultDiv = document.getElementById(`result_${apiName}`);
            let url = `https://apiv2.ajaxsystems.fun/${apiName}.php`;
            let params = new URLSearchParams();

            // Handle Loading State
            resultDiv.className = 'result-area loading';
            resultDiv.textContent = 'Sorgulanıyor...';
            
            try {
                if (isMultiParam && apiName === 'adsoyad') {
                    const name = document.getElementById('name_input_adsoyad').value.trim();
                    const surname = document.getElementById('surname_input_adsoyad').value.trim();
                    if (!name || !surname) {
                        throw new Error("Lütfen Ad ve Soyad alanlarını doldurun.");
                    }
                    params.append('name', name);
                    params.append('surname', surname);
                } else if (paramType === 'tc') {
                    const value = document.getElementById(inputId).value.trim();
                    if (!value) {
                        throw new Error("Lütfen TC Kimlik No giriniz.");
                    }
                    params.append('tc', value);
                } else if (paramType === 'gsm') {
                    const value = document.getElementById(inputId).value.trim();
                    if (!value) {
                        throw new Error("Lütfen GSM numarasını giriniz.");
                    }
                    params.append('gsm', value);
                } else if (paramType === 'address') {
                    const value = document.getElementById(inputId).value.trim();
                    if (!value) {
                        throw new Error("Lütfen adres bilgisi giriniz.");
                    }
                    params.append('address', value);
                }

                // Construct full URL
                const finalUrl = `${url}?${params.toString()}`;

                // Use a CORS proxy to bypass browser restrictions
                // We use 'api.allorigins.win' as a reliable public proxy
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(finalUrl)}`;

                // Fetch via proxy
                const response = await fetch(proxyUrl);
                
                if (!response.ok) {
                    throw new Error(`HTTP Hatası: ${response.status}`);
                }

                const data = await response.json();
                
                // The proxy returns the actual API response in data.contents
                const apiResponse = JSON.parse(data.contents);

                // Display Result
                resultDiv.className = 'result-area success';
                resultDiv.innerHTML = `<pre>${JSON.stringify(apiResponse, null, 2)}</pre>`;

            } catch (error) {
                resultDiv.className = 'result-area error';
                resultDiv.textContent = `Hata: ${error.message}`;
            }
        }
    </script>
</body>
</html>
